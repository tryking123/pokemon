server.address=${POKEMON_BIND:127.0.0.1}
server.port=${POKEMON_PORT:8080}
spring.datasource.url=jdbc:h2:file:${POKEMON_DATA:./data/pokemon};WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql,classpath:schema-game.sql,classpath:schema-payment.sql,classpath:schema-inventory.sql,classpath:schema-activity.sql
spring.h2.console.enabled=false
server.error.include-message=never
pokemon.products=${POKEMON_PRODUCTS:diamond_60:600:60,diamond_300:3000:300,diamond_680:6800:680,diamond_1280:12800:1280,diamond_3280:32800:3280,diamond_6480:64800:6480}
