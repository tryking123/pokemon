name: 功能与改进
description: 说明需求、范围和验收条件
title: "[需求] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 方案与范围
      description: 说明客户端入口、接口或玩法；涉及数值、设计、NPC 阵容时链接对应统筹目录。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 包含断网运行、存档和重启行为（适用时）。
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: 关联 Issue、文档或 PR
