name: BUG 反馈
description: 登记可复现的问题、版本与验收标准
title: "[BUG] "
body:
  - type: markdown
    attributes:
      value: 请先搜索已有 Issue。不要上传账号密码、令牌或未脱敏的角色存档。
  - type: input
    id: version
    attributes:
      label: 版本与环境
      description: 填写 APK 文件名或提交号、Android 版本，以及 APK 内置版或 PC 联调版。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与前置条件
      description: 包含入口、角色进度、操作步骤；是否断网、是否启用 ADB 反向转发。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际表现
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据与关联记录
      description: 可附脱敏日志、截图、腾讯 BUG登记“问题登记”原行号和本地台账定位。腾讯行号与 GitHub Issue 编号不可混用。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收要求
      description: 修复后需要重复的操作及存档重启验证。
